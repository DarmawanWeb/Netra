pre-commit:
  commands:
    compose:
      glob: "{docker-compose.yml,.env.example}"
      run: docker compose --env-file .env.example config --quiet
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
commit-msg:
  commands:
    conventional:
      run: |
        grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1} || { echo "use conventional commits"; exit 1; }
